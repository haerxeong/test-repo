name: Claude CI Failure Analysis

on:
  workflow_run:
    workflows: ["CI"]          # ci.yml의 name
    types: [completed]

jobs:
  analyze:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read            # 실패 로그 조회
      pull-requests: write     # 분석 결과 코멘트
      id-token: write          # Claude GitHub App 토큰 발급(OIDC)에 필요
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            RUN ID: ${{ github.event.workflow_run.id }}
            PR NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}

            CI 워크플로가 실패했습니다.
            1. `gh run view <RUN ID> --log-failed`로 실패 로그를 확인하세요.
            2. 실패 원인을 분류하세요. (컴파일 에러 / 테스트 실패 / 의존성 문제 / 환경·인프라 문제)
            3. 관련 코드를 읽고, 원인과 수정 방향을 `gh pr comment`로 PR에 코멘트로 남기세요.

            코멘트 형식:
            - 🔍 실패 원인 (한두 문장)
            - 📄 관련 파일과 라인
            - 🛠 수정 방향
            - 테스트가 불안정(flaky)해 보이면 그 근거도 함께 적어 주세요.

            코드를 수정하거나 커밋하지 마세요.
          claude_args: |
            --max-turns 8
            --allowedTools "Bash(gh run view:*),Bash(gh pr comment:*)"

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write         # 요청 시 코드 수정·커밋 가능
      pull-requests: write
      issues: write
      id-token: write         # Claude GitHub App 토큰 발급(OIDC)에 필요
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Claude가 ./gradlew test를 돌리려면 JDK가 필요
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 15
            --allowedTools "Bash(./gradlew test:*),Bash(./gradlew build:*)"
